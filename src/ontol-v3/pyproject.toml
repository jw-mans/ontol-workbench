[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uml_dsl"
version = "0.1.0"
description = "ontol-v3: Text Diagram Language (TDL) -> UML class diagrams via Graphviz"
readme = "README.md"
requires-python = ">=3.9"
# Основному пути workbench нужны только зависимости ядра TDL/SVG и системный
# бинарь Graphviz `dot`. Растровый экспорт и Streamlit вынесены в extra-наборы.
dependencies = [
    "pydantic>=2.0",
    # Проверка планарности и вспомогательные функции планарной раскладки.
    "networkx>=3.0",
]

[project.optional-dependencies]
export = ["cairosvg>=2.7", "Pillow>=10.0"]
app = ["streamlit>=1.28"]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["uml_dsl"]

[tool.setuptools.package-data]
uml_dsl = ["styles/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["scripts"]
python_files = ["test_*.py"]
addopts = "-ra"
