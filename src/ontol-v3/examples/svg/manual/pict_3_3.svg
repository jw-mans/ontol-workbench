  stroke: #9b6b18;
}

.uml-kind-badge-e {
  fill: #f29b86;
  stroke: #9d3f2f;
}

.uml-kind-badge-text {
  fill: #000000;
}

.uml-attribute-bullet {
  fill: #ffffff;
  stroke: #3aa76d;
}

.uml-operation-bullet {
  fill: #3aa76d;
  stroke: #2a7d50;
}

.uml-edge-line {
  stroke: #000000;
  stroke-width: 1;
}

.uml-marker-filled {
  fill: #000000;
  stroke: #000000;
}

.uml-marker-hollow {
  fill: #ffffff;
  stroke: #000000;
}

]]></style>

