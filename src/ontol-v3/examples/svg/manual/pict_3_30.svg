        <path class="uml-marker uml-marker-filled" d="M 0 4 L 6 0 L 12 4 L 6 8 Z" fill="#181818" stroke="#181818" stroke-width="1"/>
      </marker>

      <marker id="arrow-filled" markerWidth="9" markerHeight="8" viewBox="0 0 9 8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
        <path class="uml-marker uml-marker-filled" d="M 9 4 L 0 0 L 4 4 L 0 8 Z" fill="#181818" stroke="#181818" stroke-width="1"/>
      </marker>

      <marker id="triangle-empty" markerWidth="18" markerHeight="12" viewBox="0 0 18 12" refX="18" refY="6" orient="auto" markerUnits="userSpaceOnUse">
        <path class="uml-marker uml-marker-hollow" d="M 18 6 L 0 0 L 0 12 Z" fill="white" stroke="#181818" stroke-width="1"/>
      </marker>
    </defs>

<style id="uml-theme-yellow" type="text/css"><![CDATA[
svg.uml-diagram {
  background: #ffffff;
}

.uml-class-title {
  fill: url(#uml-yellow-title-gradient);
}

.uml-class-section,
.uml-enum-body {
  fill: url(#uml-yellow-section-gradient);
}

.uml-class-outline,
.uml-class-title,
.uml-class-section,
.uml-enum-body,
.uml-enum-title,
.uml-template-box {
  stroke: #d7a43c;
  stroke-width: 2;
}

.uml-class-title-text,
.uml-feature-text,
.uml-template-text,
.uml-edge-label,
.uml-multiplicity {
  fill: #000000;
}

.uml-kind-badge-c {
  fill: #f0c955;
  stroke: #9b6b18;
}

.uml-kind-badge-e {
  fill: #f29b86;
  stroke: #9d3f2f;
}

.uml-kind-badge-text {
  fill: #000000;
}

.uml-attribute-bullet {
  fill: #ffffff;
  stroke: #3aa76d;
}

.uml-operation-bullet {
  fill: #3aa76d;
  stroke: #2a7d50;
}

.uml-edge-line {
  stroke: #000000;
  stroke-width: 1;
}

.uml-marker-filled {
  fill: #000000;
  stroke: #000000;
}

.uml-marker-hollow {
  fill: #ffffff;
  stroke: #000000;
}

]]></style>

