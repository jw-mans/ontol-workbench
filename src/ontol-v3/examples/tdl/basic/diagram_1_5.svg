<style id="uml-theme-yellow" type="text/css"><![CDATA[
svg.uml-diagram {
  background: #ffffff;
}

.uml-class-title {
  fill: url(#uml-yellow-title-gradient);
}

.uml-class-section,
.uml-enum-body {
  fill: url(#uml-yellow-section-gradient);
}

.uml-class-outline,
.uml-class-title,
.uml-class-section,
.uml-enum-body,
.uml-enum-title,
